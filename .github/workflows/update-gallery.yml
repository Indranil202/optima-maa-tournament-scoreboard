name: Auto-update gallery.json

on:
  push:
    paths:
      - 'assets/Gallery/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan gallery folders
        run: python gen_gallery.py

      - name: Commit updated gallery.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/Gallery/gallery.json
          git diff --cached --quiet || git commit -m "🦩 Auto-update gallery.json [skip ci]"
          git push
