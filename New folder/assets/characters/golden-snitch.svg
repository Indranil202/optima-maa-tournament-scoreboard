  <path d="M52 36 Q60 32 68 36" stroke="#b8860b" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M52 44 Q60 48 68 44" stroke="#b8860b" stroke-width="0.8" fill="none" opacity="0.5"/>
  <line x1="60" y1="28" x2="60" y2="52" stroke="#b8860b" stroke-width="0.5" opacity="0.3"/>
