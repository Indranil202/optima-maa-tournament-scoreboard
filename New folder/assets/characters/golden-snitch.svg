  <path d="M42 36 Q32 28 22 22" stroke="#d4a017" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M44 38 Q35 32 25 30" stroke="#d4a017" stroke-width="0.4" fill="none" opacity="0.3"/>
