<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="hwShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/><stop offset="100%" stop-color="#2a1a40"/>
    </linearGradient>
  </defs>
  <!-- Main shield -->
  <path d="M100 5 L190 35 L190 145 Q190 200 100 230 Q10 200 10 145 L10 35Z" fill="url(#hwShield)" stroke="#d4a017" stroke-width="3"/>
  <!-- Quadrants -->
  <line x1="100" y1="35" x2="100" y2="200" stroke="#d4a017" stroke-width="2" opacity="0.5"/>
  <line x1="15" y1="115" x2="185" y2="115" stroke="#d4a017" stroke-width="2" opacity="0.5"/>
  <!-- Gryffindor (top-left) — red -->
  <rect x="18" y="40" width="78" height="72" rx="4" fill="#8b1a1a" opacity="0.6"/>
  <text x="57" y="82" font-size="28" text-anchor="middle" fill="#d4a017">🦁</text>
  <!-- Slytherin (top-right) — green -->
  <rect x="104" y="40" width="78" height="72" rx="4" fill="#1a6b3c" opacity="0.6"/>
  <text x="143" y="82" font-size="28" text-anchor="middle" fill="#c0c0c0">🐍</text>
  <!-- Ravenclaw (bottom-left) — blue -->
  <rect x="18" y="118" width="78" height="72" rx="4" fill="#2c3e6b" opacity="0.6"/>
  <text x="57" y="162" font-size="28" text-anchor="middle" fill="#cd7f32">🦅</text>
  <!-- Hufflepuff (bottom-right) — yellow -->
  <rect x="104" y="118" width="78" height="72" rx="4" fill="#6b5200" opacity="0.6"/>
  <text x="143" y="162" font-size="28" text-anchor="middle" fill="#2c1810">🦡</text>
  <!-- Center H -->
  <circle cx="100" cy="115" r="16" fill="#1a1030" stroke="#d4a017" stroke-width="2"/>
  <text x="100" y="122" font-family="serif" font-size="18" fill="#d4a017" text-anchor="middle" font-weight="bold">H</text>
  <!-- Banner -->
  <text x="100" y="218" font-family="serif" font-size="10" fill="#d4a017" text-anchor="middle" font-weight="bold">HOGWARTS</text>
</svg>