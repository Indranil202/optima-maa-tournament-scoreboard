<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#2a1a08"/><stop offset="100%" stop-color="#1a0f05"/></radialGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4a2a10"/><stop offset="100%" stop-color="#2a1508"/></linearGradient>
    <linearGradient id="beard" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e8e8e8"/><stop offset="50%" stop-color="#d0d0d0"/><stop offset="100%" stop-color="#b8b8b8"/></linearGradient>
    <linearGradient id="robe" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4a1a6b"/><stop offset="100%" stop-color="#2a0a3a"/></linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#d4a017" stroke-width="2"/>
  <!-- Robe -->
  <path d="M30,95 Q35,75 45,70 L60,68 L75,70 Q85,75 90,95 L90,118 L30,118Z" fill="url(#robe)"/>
  <path d="M42,72 L60,68 L78,72" stroke="#d4a017" stroke-width="1" fill="none" opacity=".5"/>
  <!-- Face -->
  <ellipse cx="60" cy="52" rx="18" ry="20" fill="#f0d5b0"/>
  <!-- Eyes -->
  <ellipse cx="53" cy="48" rx="2.5" ry="2" fill="#4a8bc2"/>
  <ellipse cx="67" cy="48" rx="2.5" ry="2" fill="#4a8bc2"/>
  <circle cx="53" cy="47.5" r="1" fill="#1a3050"/>
  <circle cx="67" cy="47.5" r="1" fill="#1a3050"/>
  <!-- Half-moon spectacles -->
  <path d="M46,48 A6,5 0 1,1 58,48" stroke="#d4a017" stroke-width="1" fill="none"/>
  <path d="M62,48 A6,5 0 1,1 74,48" stroke="#d4a017" stroke-width="1" fill="none"/>
  <line x1="58" y1="47" x2="62" y2="47" stroke="#d4a017" stroke-width=".8"/>
  <!-- Nose -->
  <path d="M60,50 Q58,55 60,57 Q62,55 60,50" fill="#e0c5a0" stroke="#d0b590" stroke-width=".5"/>
  <!-- Beard -->
  <path d="M42,58 Q45,62 48,60 Q52,65 56,62 Q60,68 64,62 Q68,65 72,60 Q75,62 78,58 Q80,70 76,82 Q72,95 60,100 Q48,95 44,82 Q40,70 42,58Z" fill="url(#beard)"/>
  <path d="M50,70 Q55,72 60,70 Q65,72 70,70" stroke="#c0c0c0" stroke-width=".5" fill="none" opacity=".4"/>
  <path d="M52,78 Q56,80 60,78 Q64,80 68,78" stroke="#c0c0c0" stroke-width=".5" fill="none" opacity=".3"/>
  <!-- Mustache -->
  <path d="M50,58 Q55,62 60,59 Q65,62 70,58 Q68,56 60,57 Q52,56 50,58Z" fill="#e0e0e0"/>
  <!-- Hat -->
  <path d="M38,40 Q40,38 42,36 L50,10 Q55,2 60,5 Q65,0 68,8 L78,36 Q80,38 82,40 Q75,35 60,34 Q45,35 38,40Z" fill="url(#hat)"/>
  <path d="M38,40 Q45,35 60,34 Q75,35 82,40 Q75,42 60,43 Q45,42 38,40Z" fill="#3a2010"/>
  <!-- Hat buckle/star -->
  <path d="M60,18 L62,24 L68,24 L63,28 L65,34 L60,30 L55,34 L57,28 L52,24 L58,24Z" fill="#d4a017" opacity=".8"/>
  <!-- Wand spark -->
  <circle cx="90" cy="85" r="2" fill="#ffd700" opacity=".6"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="92" cy="83" r="1" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".2;.6;.2" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>