<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <radialGradient id="owlEye" cx="35%" cy="35%"><stop offset="0%" stop-color="#ffd700"/><stop offset="60%" stop-color="#ff8c00"/><stop offset="100%" stop-color="#2c1810"/></radialGradient>
  </defs>
  <!-- Wings spread wide -->
  <path d="M100 70 Q60 30 20 20 Q30 40 25 55 Q40 50 50 60 Q60 55 70 62 Z" fill="#8B6914" opacity="0.9">
    <animate attributeName="d" dur="0.6s" repeatCount="indefinite" values="
      M100 70 Q60 30 20 20 Q30 40 25 55 Q40 50 50 60 Q60 55 70 62 Z;
      M100 70 Q65 55 30 50 Q38 60 35 70 Q48 65 58 68 Q68 64 78 68 Z;
      M100 70 Q60 30 20 20 Q30 40 25 55 Q40 50 50 60 Q60 55 70 62 Z"/>
  </path>
  <path d="M100 70 Q140 30 180 20 Q170 40 175 55 Q160 50 150 60 Q140 55 130 62 Z" fill="#8B6914" opacity="0.9">
    <animate attributeName="d" dur="0.6s" repeatCount="indefinite" values="
      M100 70 Q140 30 180 20 Q170 40 175 55 Q160 50 150 60 Q140 55 130 62 Z;
      M100 70 Q135 55 170 50 Q162 60 165 70 Q152 65 142 68 Q132 64 122 68 Z;
      M100 70 Q140 30 180 20 Q170 40 175 55 Q160 50 150 60 Q140 55 130 62 Z"/>
  </path>
  <!-- Wing feather details -->
  <path d="M40 35 Q50 45 55 55" stroke="#6B5210" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M60 40 Q65 50 68 58" stroke="#6B5210" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M160 35 Q150 45 145 55" stroke="#6B5210" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M140 40 Q135 50 132 58" stroke="#6B5210" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Body -->
  <ellipse cx="100" cy="80" rx="22" ry="25" fill="#A07828"/>
  <!-- Chest pattern -->
  <ellipse cx="100" cy="85" rx="14" ry="16" fill="#C4A04A" opacity="0.5"/>
  <path d="M90 78 Q100 75 110 78 Q108 82 100 80 Q92 82 90 78Z" fill="#8B6914" opacity="0.4"/>
  <!-- Head -->
  <circle cx="100" cy="60" r="16" fill="#A07828"/>
  <!-- Facial disc -->
  <ellipse cx="100" cy="62" rx="13" ry="11" fill="#C4A04A" opacity="0.4"/>
  <!-- Ear tufts -->
  <path d="M88 50 L82 38 L90 48Z" fill="#8B6914"/>
  <path d="M112 50 L118 38 L110 48Z" fill="#8B6914"/>
  <!-- Eyes — large, golden -->
  <circle cx="93" cy="58" r="6" fill="url(#owlEye)"/>
  <circle cx="107" cy="58" r="6" fill="url(#owlEye)"/>
  <circle cx="93" cy="57" r="3" fill="#1a0a00"/>
  <circle cx="107" cy="57" r="3" fill="#1a0a00"/>
  <circle cx="92" cy="56" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="106" cy="56" r="1.2" fill="#fff" opacity="0.8"/>
  <!-- Beak -->
  <path d="M98 63 L100 68 L102 63Z" fill="#d4a017"/>
  <!-- Talons holding letter -->
  <path d="M90 102 L85 112 L82 115" stroke="#5C4400" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88 112 L80 114" stroke="#5C4400" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M110 102 L115 112 L118 115" stroke="#5C4400" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M112 112 L120 114" stroke="#5C4400" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Letter/Envelope -->
  <rect x="82" y="115" width="36" height="24" rx="2" fill="#f5e6c8" stroke="#d4a017" stroke-width="1"/>
  <path d="M82 115 L100 130 L118 115" fill="none" stroke="#d4a017" stroke-width="1"/>
  <!-- Wax seal -->
  <circle cx="100" cy="128" r="4" fill="#c0392b"/>
  <text x="100" y="130" font-size="5" fill="#d4a017" text-anchor="middle" font-weight="bold">H</text>
  <!-- Tail feathers -->
  <path d="M95 105 L90 125 M100 105 L100 128 M105 105 L110 125" stroke="#8B6914" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
