<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="broomWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="40%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#5C2E00"/>
    </linearGradient>
    <radialGradient id="spellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ff8c00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,215,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0)"/>
    </radialGradient>
    <filter id="wizGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Broom handle -->
  <rect x="60" y="118" width="280" height="8" rx="4" fill="url(#broomWood)"/>
  <rect x="60" y="119" width="280" height="3" rx="1.5" fill="#A0522D" opacity="0.5"/>
  <!-- Broom gold rings -->
  <rect x="100" y="115" width="5" height="14" rx="2" fill="#d4a017" opacity="0.7"/>
  <rect x="120" y="115" width="5" height="14" rx="2" fill="#d4a017" opacity="0.5"/>
  <!-- Broom bristles -->
  <path d="M340 122 Q360 108 380 100 Q370 118 380 135 Q360 130 340 122Z" fill="#5C2E00"/>
  <path d="M342 120 Q365 106 385 96" stroke="#3E1F00" stroke-width="1.5" fill="none"/>
  <path d="M342 122 Q368 112 390 105" stroke="#3E1F00" stroke-width="1.2" fill="none" opacity="0.8"/>
  <path d="M342 124 Q365 130 385 140" stroke="#3E1F00" stroke-width="1.5" fill="none"/>
  <path d="M342 122 Q368 132 388 142" stroke="#3E1F00" stroke-width="1.2" fill="none" opacity="0.8"/>
  <path d="M344 122 Q372 118 395 115" stroke="#3E1F00" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Legs with boots -->
  <path d="M168 130 L160 158 L152 164" stroke="#1a0a2e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M192 130 L200 155 L210 160" stroke="#1a0a2e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="149" cy="166" rx="10" ry="5" fill="#1a1a1a"/>
  <ellipse cx="213" cy="162" rx="10" ry="5" fill="#1a1a1a"/>
  
  <!-- Body / Robe -->
  <path d="M145 75 Q155 55 180 48 L195 48 Q220 55 228 75 L235 120 Q218 135 180 135 Q142 135 138 120 Z" fill="url(#robeGrad)"/>
  <!-- Robe highlights -->
  <path d="M155 65 Q165 58 180 55 L190 55 Q200 58 208 65 L210 80 Q195 72 180 72 Q165 72 155 80 Z" fill="#2d1b4e" opacity="0.5"/>
  
  <!-- Flowing cape behind -->
  <path d="M138 120 Q125 140 108 160 Q118 155 125 162 Q115 172 105 180 Q120 168 132 158 Q128 148 130 135 Z" fill="#2d1b4e" opacity="0.8">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" values="
      M138 120 Q125 140 108 160 Q118 155 125 162 Q115 172 105 180 Q120 168 132 158 Q128 148 130 135 Z;
      M138 120 Q122 142 105 165 Q116 158 122 168 Q110 178 100 185 Q118 172 130 160 Q126 150 130 135 Z;
      M138 120 Q125 140 108 160 Q118 155 125 162 Q115 172 105 180 Q120 168 132 158 Q128 148 130 135 Z"/>
  </path>
  
  <!-- Scarf flowing -->
  <path d="M165 68 Q155 80 145 95 Q150 88 155 92 Q148 100 142 108 Q152 98 158 88 Q155 78 165 68Z" fill="#c0392b" opacity="0.85">
    <animate attributeName="d" dur="1.5s" repeatCount="indefinite" values="
      M165 68 Q155 80 145 95 Q150 88 155 92 Q148 100 142 108 Q152 98 158 88 Q155 78 165 68Z;
      M165 68 Q152 82 140 98 Q148 90 152 95 Q144 104 138 112 Q150 100 156 90 Q153 80 165 68Z;
      M165 68 Q155 80 145 95 Q150 88 155 92 Q148 100 142 108 Q152 98 158 88 Q155 78 165 68Z"/>
  </path>
  <path d="M165 68 Q160 75 155 82" stroke="#d4a017" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Head -->
  <circle cx="182" cy="38" r="18" fill="#e8c9a0"/>
  <!-- Face details -->
  <circle cx="176" cy="35" r="2.5" fill="#2c1810"/>
  <circle cx="175.5" cy="34.5" r="0.8" fill="#fff"/>
  <circle cx="189" cy="35" r="2" fill="#2c1810" opacity="0.3"/>
  <path d="M178 43 Q182 46 186 43" stroke="#b5886e" stroke-width="1" fill="none"/>
  <!-- Hair -->
  <path d="M195 30 Q200 35 202 45 Q198 38 196 42 Q200 50 198 55 Q195 45 192 40 Q196 35 195 30Z" fill="#2c1810" opacity="0.8"/>
  
  <!-- Wizard Hat -->
  <path d="M162 40 L148 44 Q142 30 158 20 L178 2 Q185 14 190 22 Q202 28 200 42 L195 38 Q192 25 185 18 L175 10 Q168 20 162 40Z" fill="#1a0a2e"/>
  <!-- Hat band -->
  <path d="M148 44 L200 42 Q196 38 182 36 Q168 38 148 44Z" fill="#d4a017" opacity="0.7"/>
  <!-- Hat buckle -->
  <rect x="172" y="37" width="10" height="8" rx="2" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="175" y="39" width="4" height="4" rx="1" fill="#d4a017"/>
  
  <!-- Arm extended with wand -->
  <path d="M150 82 L120 65 L95 50" stroke="#e8c9a0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Robe sleeve -->
  <path d="M150 78 Q140 72 132 68 Q138 75 130 72 Q135 80 145 85Z" fill="#2d1b4e"/>
  
  <!-- Wand -->
  <line x1="95" y1="50" x2="50" y2="30" stroke="#5C2E00" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="95" y1="50" x2="50" y2="30" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <!-- Wand core glow line -->
  <line x1="80" y1="42" x2="55" y2="32" stroke="#d4a017" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Spell at wand tip -->
  <circle cx="48" cy="28" r="15" fill="url(#spellGlow)" filter="url(#wizGlow)">
    <animate attributeName="r" dur="0.8s" repeatCount="indefinite" values="12;18;12"/>
    <animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" values="0.8;1;0.8"/>
  </circle>
  <circle cx="48" cy="28" r="5" fill="#ffd700" opacity="0.9">
    <animate attributeName="r" dur="0.6s" repeatCount="indefinite" values="4;6;4"/>
  </circle>
  
  <!-- Spell sparks -->
  <circle cx="38" cy="22" r="2" fill="#ffd700" opacity="0.7">
    <animate attributeName="cx" dur="1.2s" repeatCount="indefinite" values="38;28;38"/>
    <animate attributeName="cy" dur="1.2s" repeatCount="indefinite" values="22;15;22"/>
    <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0.8;0;0.8"/>
  </circle>
  <circle cx="55" cy="18" r="1.5" fill="#ff8c00" opacity="0.6">
    <animate attributeName="cx" dur="1.5s" repeatCount="indefinite" values="55;45;55"/>
    <animate attributeName="cy" dur="1.5s" repeatCount="indefinite" values="18;10;18"/>
    <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0.6;0;0.6"/>
  </circle>
  <circle cx="42" cy="35" r="1.5" fill="#ffd700" opacity="0.5">
    <animate attributeName="cx" dur="1s" repeatCount="indefinite" values="42;30;42"/>
    <animate attributeName="cy" dur="1s" repeatCount="indefinite" values="35;40;35"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="0.5;0;0.5"/>
  </circle>
  
  <!-- Ambient spell glow around wizard -->
  <ellipse cx="180" cy="90" rx="60" ry="50" fill="url(#moonGlow)" opacity="0.3"/>
</svg>
