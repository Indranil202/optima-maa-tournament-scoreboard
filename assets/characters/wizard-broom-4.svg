<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="w4Robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a40"/><stop offset="100%" stop-color="#5b7fc7"/>
    </linearGradient>
    <linearGradient id="w4Broom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B3410"/><stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
  </defs>

  <!-- Broom — angled upward, climbing -->
  <path d="M50 145 Q200 120 340 105" stroke="url(#w4Broom)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M50 145 Q200 122 340 105" stroke="#8B6540" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Bristles -->
  <path d="M340 105 Q360 92 380 82 Q365 102 378 122 Q360 115 340 105Z" fill="#3E1F00"/>
  <path d="M342 103 Q365 90 385 78" stroke="#2c1810" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M342 107 Q368 118 385 130" stroke="#2c1810" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Silver broom bands -->
  <rect x="95" y="135" width="3" height="10" rx="1.5" fill="#aaa" opacity="0.5" transform="rotate(-8 96 140)"/>
  <rect x="115" y="132" width="3" height="10" rx="1.5" fill="#aaa" opacity="0.4" transform="rotate(-8 116 137)"/>

  <!-- Body — leaning back, one arm raised victoriously -->
  <g transform="rotate(-10 170 95)">
    <path d="M140 70 Q155 52 175 48 L190 50 Q208 58 210 76 L212 120 Q195 128 170 126 Q148 124 142 114Z" fill="url(#w4Robe)"/>
    <!-- Bronze eagle emblem -->
    <path d="M172 82 L178 72 L184 82 L178 78Z" fill="#cd7f32" opacity="0.6"/>
    <!-- Sash -->
    <path d="M148 80 Q175 76 205 82" stroke="#cd7f32" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Legs — one leg dangling free -->
  <path d="M165 128 Q180 138 198 130 L208 122" stroke="#0a1230" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M160 130 Q148 145 145 155" stroke="#0a1230" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Boot -->
  <path d="M143 153 Q138 158 142 162 Q148 160 150 155" fill="#1a1a2e"/>

  <!-- Scarf streaming behind -->
  <path d="M195 72 Q215 80 240 95 Q232 100 225 108 Q245 118 265 128" fill="#5b7fc7" opacity="0.5">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M195 72 Q215 80 240 95 Q232 100 225 108 Q245 118 265 128;
      M195 72 Q220 84 248 100 Q238 108 230 115 Q252 128 275 138;
      M195 72 Q215 80 240 95 Q232 100 225 108 Q245 118 265 128"/>
  </path>
  <path d="M195 78 Q218 88 245 102 Q235 108 228 115 Q250 125 270 135" fill="#cd7f32" opacity="0.3">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M195 78 Q218 88 245 102 Q235 108 228 115 Q250 125 270 135;
      M195 78 Q222 92 252 108 Q242 115 235 122 Q258 132 280 142;
      M195 78 Q218 88 245 102 Q235 108 228 115 Q250 125 270 135"/>
  </path>

  <!-- Head -->
  <circle cx="155" cy="48" r="15" fill="#f0d5a8"/>
  <!-- Eyes — looking up excitedly -->
  <ellipse cx="149" cy="45" rx="3" ry="3" fill="#0e1a40"/>
  <ellipse cx="162" cy="45" rx="3" ry="3" fill="#0e1a40"/>
  <circle cx="148" cy="44" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="161" cy="44" r="1.2" fill="#fff" opacity="0.6"/>
  <!-- Open mouth — shouting/cheering -->
  <ellipse cx="155" cy="54" rx="4" ry="2.5" fill="#8b5e3c" opacity="0.7"/>
  <!-- Hair blowing back -->
  <path d="M140 38 Q132 32 128 40 Q130 35 135 33" fill="#2c1810" opacity="0.7"/>
  <path d="M168 38 Q175 32 180 42 Q176 36 172 35" fill="#2c1810" opacity="0.7"/>
  <path d="M165 35 Q172 28 178 34 Q174 30 170 30" fill="#2c1810" opacity="0.6"/>

  <!-- Wizard hat — slightly askew from wind -->
  <path d="M135 46 Q130 28 142 10 Q152 2 158 15 Q162 28 166 42 Q158 38 150 37 Q142 38 135 46Z" fill="#0e1a40" transform="rotate(8 150 30)"/>
  <path d="M135 46 Q142 40 155 40 Q166 42 166 42" fill="#cd7f32" opacity="0.35"/>

  <!-- Raised arm — waving/celebrating -->
  <path d="M138 72 L118 48 L105 25" stroke="#f0d5a8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Open hand -->
  <path d="M105 25 L98 18 M105 25 L100 15 M105 25 L105 14 M105 25 L110 16" stroke="#f0d5a8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Other arm on broom -->
  <path d="M180 76 L168 105 L155 118" stroke="#f0d5a8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="153" cy="120" r="4" fill="#0e1a40"/>

  <!-- Tiny book floating nearby -->
  <g transform="translate(80 60) rotate(-15)">
    <rect x="0" y="0" width="14" height="18" rx="1" fill="#5b7fc7" opacity="0.6"/>
    <line x1="7" y1="0" x2="7" y2="18" stroke="#cd7f32" stroke-width="0.8" opacity="0.5"/>
    <animate attributeName="transform" dur="2s" repeatCount="indefinite" values="translate(80 60) rotate(-15);translate(78 55) rotate(-10);translate(80 60) rotate(-15)"/>
  </g>

  <!-- Speed lines -->
  <line x1="270" y1="80" x2="350" y2="76" stroke="#fff" stroke-width="0.8" opacity="0.12"/>
  <line x1="260" y1="95" x2="355" y2="90" stroke="#fff" stroke-width="1" opacity="0.1"/>
  <line x1="265" y1="140" x2="340" y2="136" stroke="#fff" stroke-width="0.7" opacity="0.08"/>
</svg>
